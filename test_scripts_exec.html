<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Test Scripts</title>
</head>
<body style="background:#1e1e1e; color:#eee; font-family:monospace; padding:20px;">
    <h2>Testing Scripts Execution</h2>
    <div id="results"></div>

    <script src="js/ae-core.js"></script>
    <script src="js/scriptui.js"></script>
    <script src="js/windows-color-picker.js"></script>
    <script src="js/ae-renderer.js"></script>
    <script src="js/presets.js"></script>

    <script>
    const log = (msg, pass) => {
        const div = document.createElement('div');
        div.style.color = pass === true ? '#4ade80' : (pass === false ? '#f87171' : '#fbbf24');
        div.textContent = (pass === true ? '✔ PASS: ' : (pass === false ? '❌ FAIL: ' : 'ℹ INFO: ')) + msg;
        document.getElementById('results').appendChild(div);
        console.log(msg);
    };

    window.onerror = function(msg, url, line, col, err) {
        log(`Uncaught error: ${msg} at line ${line}:${col} - Stack: ${err ? err.stack : 'none'}`, false);
    };

    async function testScript(url, name) {
        log(`--- Testing ${name} (${url}) ---`, null);
        try {
            // Reset app project
            app.project = new Project();
            const res = await fetch(url);
            if (!res.ok) {
                log(`Failed to fetch ${url}: ${res.statusText}`, false);
                return;
            }
            const code = await res.text();
            log(`Fetched ${name} (${code.length} bytes)`, true);

            // Execute code
            try {
                eval(code);
                log(`eval(${name}) executed without syntax error`, true);
            } catch (evalErr) {
                log(`Error executing ${name}: ${evalErr.message}\n${evalErr.stack}`, false);
                return;
            }

            // Check if comp was created
            const comp = app.project.activeItem;
            if (!comp) {
                log(`No activeItem/comp created for ${name}`, false);
            } else {
                log(`Active comp created: "${comp.name}" with ${comp.layers.length} layers`, true);
            }

            // Check if ScriptUI window was created and has build button
            if (window._lastCreatedWindow || (typeof ScriptUI !== 'undefined')) {
                log(`Checking ScriptUI UI elements...`, null);
            }

        } catch (e) {
            log(`Outer error testing ${name}: ${e.message}\n${e.stack}`, false);
        }
    }

    async function runAll() {
        await testScript('jsx/cube_maker.jsx', 'cube_maker.jsx');
        await testScript('jsx/cylinder_maker.jsx', 'cylinder_maker.jsx');
        await testScript('jsx/extruded_round_rectangle.jsx', 'extruded_round_rectangle.jsx');
        window.__TESTS_COMPLETE__ = true;
    }

    runAll();
    </script>
</body>
</html>
